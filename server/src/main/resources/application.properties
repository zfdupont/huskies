# Deployment injects SPRING_DATA_MONGODB_URI (from DATABASE_URI via compose). The
# fallback is a bare local Mongo so no credentials live in the repo; set the env var
# to point at Atlas or any remote cluster.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/huskies}
spring.data.mongodb.database=huskies
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
spring.jackson.serialization.INDENT_OUTPUT=false
spring.data.mongodb.auto-index-creation=true
server.port=8090

# Compress large GeoJSON API responses over the wire.
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json,text/plain
server.compression.min-response-size=1024